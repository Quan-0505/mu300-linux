name: F50 internal OpenWrt with Rust daed
run-name: F50 6.18 + Rust daed · ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    branches: [codex/f50-internal-kdae]
    paths: ['.github/workflows/f50-kdae-release.yml', 'f50/**']
permissions:
  contents: read
concurrency:
  group: f50-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check build and update contracts
        run: |
          python3 -m unittest discover -s f50 -p 'test_*.py'
          sh -n rootfs/overlay/opt/mu300/bin/mu300-update
          sh -n f50/overlay/etc/init.d/daed
          sh -n f50/overlay/etc/init.d/owjdxb
          sh -n f50/overlay/usr/libexec/f50-nodebaby-guard
      - uses: actions/cache@v4
        with:
          path: work/block-mount-mu300.apk*
          key: f50-block-${{ hashFiles('openwrt/*block*', 'openwrt/patches/fstools-probe-device-types.patch') }}
      - run: sh openwrt/build-block-mount.sh
      - uses: actions/upload-artifact@v4
        with:
          name: block
          path: work/block-mount-mu300.apk*
          if-no-files-found: error
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: upstream/out
          key: f50-6.18.56-${{ hashFiles('upstream/**') }}
      - name: Build native F50 kernel and matching modules
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build -t mu300-mainline-build upstream/
          docker volume create f50-mainline
          docker run --rm -e KV=6.18.56 -v f50-mainline:/src -v "$PWD/upstream":/work mu300-mainline-build bash /work/build.sh
          docker run --rm -e KV=6.18.56 -v f50-mainline:/src -v "$PWD/upstream":/work mu300-mainline-build bash /work/build-modules.sh > /dev/null
      - name: Verify the actual Image and module payload
        run: |
          python3 upstream/audit-bundle.py upstream/out
          python3 upstream/check-container-support.py upstream/out
          python3 f50/build.py kernel-attest upstream/out
          tar -czf kernel-outputs.tar.gz -C upstream/out .
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel-outputs.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kernel-logs
          path: upstream/out/**/*.log
          if-no-files-found: ignore
  rust-daed:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Quan-0505/rust-daed
          ref: dfee5ebc11e432dd09ac5d8ab6e87f64458f16c5
          path: rust-daed
          persist-credentials: false
      - name: Install Rust release dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang llvm libclang-dev libelf-dev cmake libssl-dev perl pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu dpkg-dev curl file zstd
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          components: rust-src
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Keep stable as the top-level compiler
        run: rustup default stable
      - name: Install pinned BPF linker release
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bpf-linker-v0.12.0.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bpf-linker"
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP/bpf-linker"
          linker="$(find "$RUNNER_TEMP/bpf-linker" -type f -name bpf-linker -print -quit)"
          test -n "$linker"
          install -m 0755 "$linker" "$HOME/.cargo/bin/bpf-linker"
          bpf-linker --version
      - name: Build Rust daemon and extract the checked ARM64 package
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          actual=subprocess.check_output(['git','-C','rust-daed','rev-parse','HEAD'],text=True).strip()
          assert actual == 'dfee5ebc11e432dd09ac5d8ab6e87f64458f16c5', actual
          assert "VERSION = '3.2.2'" in Path('f50/build.py').read_text()
          PY
          RUST_RELEASE_CACHE="$RUNNER_TEMP/rust-cache" bash rust-daed/scripts/build-release.sh "$RUNNER_TEMP/rust-daed-release"
          python3 - <<'PY'
          import os, pathlib, tarfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rust-daed-release'
          work=pathlib.Path('work/f50-addons'); work.mkdir(parents=True,exist_ok=True)
          with tarfile.open(out/'assets/rust-daed-r2s.apk','r:gz') as pkg:
              members={m.name.removeprefix('./'):m for m in pkg.getmembers()}
              for name in ['usr/bin/daed','usr/share/daed/geoip.dat','usr/share/daed/geosite.dat','usr/share/daed/web/index.html']:
                  assert name in members and members[name].isfile(), name
              binary=pkg.extractfile(members['usr/bin/daed']).read()
              assert binary[:5]==b'\x7fELF\x02' and int.from_bytes(binary[18:20],'little')==183 and b'version=v3.2.2' in binary
              (work/'daed').write_bytes(binary)
              for name in ['geoip.dat','geosite.dat']:
                  (work/name).write_bytes(pkg.extractfile(members['usr/share/daed/'+name]).read())
              web=work/'web'; web.mkdir(exist_ok=True)
              for name,member in members.items():
                  prefix='usr/share/daed/web/'
                  if name.startswith(prefix) and member.isfile():
                      rel=pathlib.PurePosixPath(name[len(prefix):])
                      assert not rel.is_absolute() and '..' not in rel.parts
                      target=web.joinpath(*rel.parts); target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(pkg.extractfile(member).read())
          assert (work/'web/index.html').is_file()
          print('Rust daed 3.2.2 ARM64 package, web UI and geodata verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rust-daed
          path: |
            work/f50-addons/daed
            work/f50-addons/geoip.dat
            work/f50-addons/geosite.dat
            work/f50-addons/web/**
          if-no-files-found: error
  package:
    needs: [block, kernel, rust-daed]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: block
          path: work
      - uses: actions/download-artifact@v4
        with:
          name: kernel
      - uses: actions/download-artifact@v4
        with:
          name: rust-daed
          path: work/f50-addons
      - name: Prepare verified public inputs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lz4 cpio python3-lz4
          mkdir -p upstream/out
          tar -xzf kernel-outputs.tar.gz -C upstream/out
          python3 f50/build.py kernel-rebind upstream/out
          python3 f50/build.py inputs
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64
      - name: Assemble clean rootfs and boot updater bundle
        run: |
          export MU300_INPUTS="$PWD/work/f50-inputs"
          export MU300_MAINLINE_OUT="$PWD/upstream/out"
          export MU300_VERSION="f50-${GITHUB_SHA:0:7}"
          sh openwrt/build-rootfs.sh f50-base-rootfs.tar.gz
          mkdir -p release/f50
          sh upstream/make-bundle.sh "$PWD/release/f50/mu300-kernel-6.18.tar.gz" "$PWD/work/f50-inputs/kernel-5.4.tar.gz"
          python3 f50/build.py rootfs openwrt/f50-base-rootfs.tar.gz release/f50/mu300-openwrt-rootfs.tar.gz
          cp rootfs/overlay/opt/mu300/bin/mu300-update release/f50/mu300-update
          cp f50/README.zh-CN.md release/f50/README.zh-CN.md
          python3 f50/build.py manifest release/f50
      - name: Publish as untested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="f50-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          gh release create "$tag" release/f50/* --target "$GITHUB_SHA" --prerelease --title "F50 OpenWrt 25.12.5 · Rust daed 3.2.2 · 6.18.56（待实机验证）" --notes-file f50/README.zh-CN.md
      - uses: actions/upload-artifact@v4
        with:
          name: f50-upgrade
          path: release/f50
          if-no-files-found: error
